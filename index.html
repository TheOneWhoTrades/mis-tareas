<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Tareas</title>
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #fff9d6;
    color: #222;
    max-width: 700px;
    margin: 30px auto;
    padding: 0 16px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .fecha { color: #777; margin-bottom: 20px; }

  /* Pestañas de proyectos */
  .pestanas { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 2px solid #e0d58a; }
  .pestana {
    padding: 8px 14px;
    background: #f3eaa9;
    border: none;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 14px;
  }
  .pestana.activa { background: #e0d58a; font-weight: bold; }
  .pestana.nueva { background: transparent; color: #777; }

  /* Formulario para agregar tarea */
  form { display: flex; gap: 8px; margin: 20px 0; }
  input[type=text] {
    flex: 1;
    padding: 8px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button { cursor: pointer; }
  .boton { padding: 8px 14px; border: none; border-radius: 4px; background: #333; color: white; }

  /* Tablero de post-its */
  ul {
    list-style: none;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 18px;
  }
  li {
    position: relative;
    min-height: 130px;
    padding: 14px 12px;
    background: #ffeb7a;
    box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.18);
    transform: rotate(-1.5deg);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  /* Colores y giros distintos para que parezcan pegados a mano */
  li:nth-child(4n+2) { background: #ffc4d6; transform: rotate(1.5deg); }
  li:nth-child(4n+3) { background: #b8f0c4; transform: rotate(-0.5deg); }
  li:nth-child(4n+4) { background: #b9dcff; transform: rotate(1deg); }
  li span { flex: 1; cursor: pointer; font-size: 15px; word-wrap: break-word; }
  li.hecha { opacity: 0.55; }
  li.hecha span { text-decoration: line-through; }
  li .borrar { position: absolute; top: 4px; right: 6px; border: none; background: none; color: #888; font-size: 14px; }
  li .borrar:hover { color: red; }
  li.vacio { background: none; box-shadow: none; transform: none; min-height: 0; }

  .acciones { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
  .acciones button { background: none; border: 1px solid #aaa; border-radius: 4px; padding: 5px 10px; color: #555; }
  .vacio { color: #999; font-style: italic; }

  /* Widget de la Liga Profesional, fijo en la esquina de abajo a la derecha */
  .liga { position: fixed; right: 16px; bottom: 16px; z-index: 100; font-size: 13px; }
  .liga-abrir {
    padding: 8px 14px;
    border: none;
    border-radius: 20px;
    background: #333;
    color: white;
    font-size: 14px;
    box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.18);
  }
  .liga-panel {
    display: none;
    width: 300px;
    max-width: calc(100vw - 32px);
    background: #fffdf0;
    border: 1px solid #e0d58a;
    border-radius: 8px;
    box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.18);
    overflow: hidden;
  }
  .liga.abierta .liga-abrir { display: none; }
  .liga.abierta .liga-panel { display: block; }
  .liga-cabecera { display: flex; align-items: center; gap: 4px; padding: 8px 10px; background: #e0d58a; }
  .liga-cabecera strong { flex: 1; }
  .liga-cabecera button { border: none; background: none; font-size: 14px; color: #555; }
  .liga-pestanas { display: flex; }
  .liga-pestanas button { flex: 1; padding: 6px; border: none; background: #f3eaa9; font-size: 13px; }
  .liga-pestanas button.activa { background: #fffdf0; font-weight: bold; }
  .liga-contenido { max-height: 50vh; overflow-y: auto; padding: 4px 10px; }
  .liga-pie { padding: 4px 10px 6px; color: #999; font-size: 11px; }
  .liga-aviso { color: #999; font-style: italic; padding: 10px 0; }
  .liga-dia { margin: 8px 0 2px; color: #777; font-weight: bold; text-transform: capitalize; }
  .liga-partido {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 6px;
    align-items: center;
    padding: 4px 0;
    border-bottom: 1px dashed #eee3a8;
  }
  .liga-partido .local { text-align: right; }
  .liga-resultado { min-width: 50px; text-align: center; font-weight: bold; }
  .liga-resultado small { display: block; color: #777; font-size: 11px; font-weight: normal; }
  .liga-resultado.vivo small { color: #d33; font-weight: bold; }
  .liga table { width: 100%; border-collapse: collapse; }
  .liga th, .liga td { padding: 3px 2px; text-align: right; }
  .liga th { color: #777; font-weight: normal; border-bottom: 1px solid #e0d58a; }
  .liga .equipo { text-align: left; }
  .liga tr + tr td { border-top: 1px dashed #eee3a8; }
  .liga img { width: 16px; height: 16px; vertical-align: middle; }

  /* Widgets chicos de la esquina de abajo a la izquierda (dólar y clima) */
  .izq {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
  }
  .mini-abrir {
    padding: 8px 14px;
    border: none;
    border-radius: 20px;
    background: #333;
    color: white;
    font-size: 14px;
    box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.18);
  }
  .mini-panel {
    display: none;
    width: 220px;
    background: #fffdf0;
    border: 1px solid #e0d58a;
    border-radius: 8px;
    box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.18);
    overflow: hidden;
  }
  .mini.abierto .mini-abrir { display: none; }
  .mini.abierto .mini-panel { display: block; }
  .mini-cabecera { display: flex; align-items: center; padding: 6px 10px; background: #e0d58a; }
  .mini-cabecera strong { flex: 1; }
  .mini-cabecera button { border: none; background: none; font-size: 14px; color: #555; }
  .mini-contenido { padding: 4px 10px; }
  .mini-pie { padding: 4px 10px 6px; color: #999; font-size: 11px; }
  .mini-aviso { color: #999; font-style: italic; padding: 8px 0; }
  .mini table { width: 100%; border-collapse: collapse; }
  .mini th, .mini td { padding: 3px 2px; text-align: right; }
  .mini th { color: #777; font-weight: normal; border-bottom: 1px solid #e0d58a; }
  .mini th:first-child, .mini td:first-child { text-align: left; }
  .mini tr + tr td { border-top: 1px dashed #eee3a8; }
  .mini-pie a { color: inherit; }
  .clima-ahora { display: flex; align-items: center; gap: 8px; padding: 6px 0 2px; }
  .clima-temp { font-size: 26px; font-weight: bold; white-space: nowrap; }
  .clima-detalle { padding-bottom: 6px; border-bottom: 1px solid #e0d58a; color: #777; font-size: 12px; }
</style>
</head>
<body>

<h1>Mis Tareas</h1>
<div class="fecha" id="fecha"></div>

<div class="pestanas" id="pestanas"></div>

<form id="formulario">
  <input type="text" id="nuevaTarea" placeholder="Escribí una tarea y apretá Enter..." autofocus>
  <button class="boton">Agregar</button>
</form>

<ul id="lista"></ul>

<div class="acciones">
  <button onclick="borrarHechas()">Borrar tareas tachadas</button>
  <button onclick="renombrarProyecto()">Renombrar proyecto</button>
  <button onclick="borrarProyecto()">Borrar proyecto</button>
</div>

<!-- Widget de la Liga Profesional (esquina de abajo a la derecha) -->
<div class="liga" id="liga">
  <button class="liga-abrir" id="ligaAbrir">⚽ Liga Profesional</button>
  <div class="liga-panel">
    <div class="liga-cabecera">
      <strong>Liga Profesional</strong>
      <button id="ligaRecargar" title="Actualizar">↻</button>
      <button id="ligaCerrar" title="Minimizar">—</button>
    </div>
    <div class="liga-pestanas">
      <button data-pestana="partidos">Partidos</button>
      <button data-pestana="tabla">Tabla anual</button>
    </div>
    <div class="liga-contenido" id="ligaContenido"></div>
    <div class="liga-pie" id="ligaPie"></div>
  </div>
</div>

<!-- Widgets de la esquina de abajo a la izquierda. Minimizados muestran el dato principal. -->
<div class="izq">
  <div class="mini" id="clima">
    <button class="mini-abrir">🌡️ Clima</button>
    <div class="mini-panel">
      <div class="mini-cabecera">
        <strong>Clima en CABA</strong>
        <button class="mini-cerrar" title="Minimizar">—</button>
      </div>
      <div class="mini-contenido"><div class="mini-aviso">Cargando...</div></div>
      <div class="mini-pie"></div>
    </div>
  </div>
  <div class="mini" id="dolar">
    <button class="mini-abrir">💵 Dólar</button>
    <div class="mini-panel">
      <div class="mini-cabecera">
        <strong>Dólar</strong>
        <button class="mini-cerrar" title="Minimizar">—</button>
      </div>
      <div class="mini-contenido"><div class="mini-aviso">Cargando...</div></div>
      <div class="mini-pie"></div>
    </div>
  </div>
</div>

<script>
  // ---------- DATOS ----------
  // Todo se guarda en el navegador (localStorage), así que no se pierde al cerrar.
  // Forma de los datos:
  // { activo: "UNBOX DEVS", proyectos: { "UNBOX DEVS": [ {texto: "...", hecha: false}, ... ] } }

  let datos = JSON.parse(localStorage.getItem("misTareas")) || {
    activo: "UNBOX DEVS",
    proyectos: { "UNBOX DEVS": [] }
  };

  // Limpieza de una sola vez: saca TakemyCard y Tesis que venían en la primera versión.
  // Después de correr una vez no vuelve a tocar nada (por si más adelante creás proyectos con esos nombres).
  if (!datos.limpiado) {
    delete datos.proyectos["TakemyCard"];
    delete datos.proyectos["Tesis"];
    if (!datos.proyectos[datos.activo]) datos.activo = Object.keys(datos.proyectos)[0] || "UNBOX DEVS";
    if (!datos.proyectos[datos.activo]) datos.proyectos[datos.activo] = [];
    datos.limpiado = true;
  }

  function guardar() {
    localStorage.setItem("misTareas", JSON.stringify(datos));
  }

  // ---------- DIBUJAR LA PANTALLA ----------
  function dibujar() {
    // Pestañas
    const pestanas = document.getElementById("pestanas");
    pestanas.innerHTML = "";
    for (const nombre in datos.proyectos) {
      const boton = document.createElement("button");
      boton.className = "pestana" + (nombre === datos.activo ? " activa" : "");
      boton.textContent = nombre;
      boton.onclick = () => { datos.activo = nombre; guardar(); dibujar(); };
      pestanas.appendChild(boton);
    }
    const nueva = document.createElement("button");
    nueva.className = "pestana nueva";
    nueva.textContent = "+ Proyecto";
    nueva.onclick = nuevoProyecto;
    pestanas.appendChild(nueva);

    // Tareas del proyecto activo
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    const tareas = datos.proyectos[datos.activo] || [];

    if (tareas.length === 0) {
      lista.innerHTML = '<li class="vacio">No hay tareas todavía.</li>';
    }

    tareas.forEach((tarea, i) => {
      const li = document.createElement("li");
      if (tarea.hecha) li.className = "hecha";

      const check = document.createElement("input");
      check.type = "checkbox";
      check.checked = tarea.hecha;
      check.onchange = () => tachar(i);

      const texto = document.createElement("span");
      texto.textContent = tarea.texto;
      texto.onclick = () => tachar(i);

      const borrar = document.createElement("button");
      borrar.className = "borrar";
      borrar.textContent = "✕";
      borrar.title = "Borrar tarea";
      borrar.onclick = () => { tareas.splice(i, 1); guardar(); dibujar(); };

      li.append(check, texto, borrar);
      lista.appendChild(li);
    });
  }

  // ---------- ACCIONES ----------
  function tachar(i) {
    const tarea = datos.proyectos[datos.activo][i];
    tarea.hecha = !tarea.hecha;
    guardar();
    dibujar();
  }

  document.getElementById("formulario").onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById("nuevaTarea");
    const texto = input.value.trim();
    if (!texto) return;
    datos.proyectos[datos.activo].push({ texto: texto, hecha: false });
    input.value = "";
    guardar();
    dibujar();
  };

  function borrarHechas() {
    datos.proyectos[datos.activo] = datos.proyectos[datos.activo].filter(t => !t.hecha);
    guardar();
    dibujar();
  }

  function nuevoProyecto() {
    const nombre = prompt("Nombre del nuevo proyecto:");
    if (!nombre || datos.proyectos[nombre]) return;
    datos.proyectos[nombre] = [];
    datos.activo = nombre;
    guardar();
    dibujar();
  }

  function renombrarProyecto() {
    const viejo = datos.activo;
    const nuevo = prompt("Nuevo nombre para " + viejo + ":", viejo);
    if (!nuevo || nuevo === viejo || datos.proyectos[nuevo]) return;
    // Rearmamos el objeto para que la pestaña quede en el mismo lugar
    const proyectos = {};
    for (const nombre in datos.proyectos) {
      proyectos[nombre === viejo ? nuevo : nombre] = datos.proyectos[nombre];
    }
    datos.proyectos = proyectos;
    datos.activo = nuevo;
    guardar();
    dibujar();
  }

  function borrarProyecto() {
    if (Object.keys(datos.proyectos).length === 1) return alert("Tiene que quedar al menos un proyecto.");
    if (!confirm("¿Borrar el proyecto " + datos.activo + " y todas sus tareas?")) return;
    delete datos.proyectos[datos.activo];
    datos.activo = Object.keys(datos.proyectos)[0];
    guardar();
    dibujar();
  }

  // Fecha de hoy arriba, estilo "martes 27 de octubre"
  document.getElementById("fecha").textContent =
    new Date().toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });

  dibujar();
</script>

<script>
  // ---------- LIGA PROFESIONAL (widget de la esquina) ----------
  // Los datos salen de la API pública de ESPN. No pide clave, pero no es oficial:
  // si ESPN la cambia, el widget muestra un aviso en vez de romper la página.
  // "arg.1" es el código que usa ESPN para la Liga Profesional argentina.
  const ESPN = "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.1/scoreboard";
  const UNA_HORA = 60 * 60 * 1000;

  // Lo que recuerda el widget: si está abierto, en qué pestaña y la última tabla calculada.
  // La tabla anual necesita todos los partidos del año, así que se recalcula como mucho una vez por hora.
  let liga = JSON.parse(localStorage.getItem("ligaWidget")) || {
    abierto: window.innerWidth >= 1360, // si la pantalla no es bien ancha arranca minimizado para no tapar las tareas
    pestana: "partidos",
    tabla: null
  };

  function guardarLiga() {
    localStorage.setItem("ligaWidget", JSON.stringify(liga));
  }

  // ---------- PEDIR DATOS A ESPN ----------
  // ESPN no acepta rangos de fechas para esta liga: se le pide un mes entero (202610) o un año (2026)
  function mesESPN(fecha) {
    return fecha.getFullYear() + String(fecha.getMonth() + 1).padStart(2, "0");
  }

  // "21:00"
  function hora(fecha) {
    return fecha.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false });
  }

  function sumarDias(fecha, dias) {
    const nueva = new Date(fecha);
    nueva.setDate(nueva.getDate() + dias);
    return nueva;
  }

  async function traerPartidos(fechas) {
    const respuesta = await fetch(ESPN + "?limit=1000&dates=" + fechas);
    if (!respuesta.ok) throw new Error("ESPN respondió " + respuesta.status);
    const json = await respuesta.json();
    return (json.events || []).map(leerPartido);
  }

  // Pasa un partido de ESPN a algo más fácil de usar
  function leerPartido(ev) {
    const comp = ev.competitions[0];
    const local = comp.competitors.find(c => c.homeAway === "home");
    const visitante = comp.competitors.find(c => c.homeAway === "away");
    return {
      id: ev.id,
      fecha: new Date(ev.date),
      estado: ev.status.type,        // estado.state: "pre" (no empezó), "in" (en juego) o "post" (terminó)
      reloj: ev.status.displayClock, // minuto de juego, ej. "67'"
      eliminatoria: esEliminatoria(ev),
      local: leerEquipo(local),
      visitante: leerEquipo(visitante)
    };
  }

  function leerEquipo(c) {
    const goles = c.score && typeof c.score === "object" ? c.score.value : c.score;
    return {
      id: c.team.id,
      nombre: c.team.shortDisplayName || c.team.displayName,
      logo: c.team.logo,
      goles: Number(goles) || 0
    };
  }

  // Octavos, cuartos, semis y final no suman en la tabla anual.
  // ESPN marca la etapa en season.slug: "torneo-apertura" y "torneo-clausura" son la fase regular,
  // y los playoffs vienen como "apertura---round-of-16", "apertura---quarterfinals", "apertura---final", etc.
  function esEliminatoria(ev) {
    const etapa = (ev.season && ev.season.slug) || "";
    return /round|quarter|semi|final|playoff/i.test(etapa);
  }

  // ---------- PESTAÑA PARTIDOS ----------
  // Muestra los partidos de 3 días atrás a 7 días adelante, agrupados por día
  async function cargarPartidos() {
    const desde = sumarDias(new Date(), -3);
    const hasta = sumarDias(new Date(), 7);
    desde.setHours(0, 0, 0, 0);
    hasta.setHours(23, 59, 59, 999);
    // Si la semana cae entre dos meses, se piden los dos
    const meses = [...new Set([mesESPN(desde), mesESPN(hasta)])];
    let partidos = (await Promise.all(meses.map(traerPartidos))).flat()
      .filter(p => p.fecha >= desde && p.fecha <= hasta);
    let html = "";
    if (partidos.length === 0) {
      partidos = await proximosPartidos(hasta);
      if (partidos.length === 0) return '<div class="liga-aviso">No hay partidos programados por ahora.</div>';
      html = '<div class="liga-aviso">No hay partidos esta semana. Estos son los próximos:</div>';
    }

    partidos.sort((a, b) => a.fecha - b.fecha);
    let diaAnterior = "";
    for (const p of partidos) {
      const dia = p.fecha.toLocaleDateString("es-AR", { weekday: "long" }) + " " + p.fecha.getDate() + "/" + (p.fecha.getMonth() + 1);
      if (dia !== diaAnterior) {
        html += '<div class="liga-dia">' + dia + "</div>";
        diaAnterior = dia;
      }
      html += '<div class="liga-partido">' +
        '<span class="local">' + escapar(p.local.nombre) + " " + logo(p.local.logo) + "</span>" +
        resultado(p) +
        "<span>" + logo(p.visitante.logo) + " " + escapar(p.visitante.nombre) + "</span>" +
        "</div>";
    }
    return html;
  }

  // Cuando no hay partidos en la semana (por ejemplo, entre la fase regular y los playoffs),
  // busca en los meses que siguen y devuelve la próxima fecha: los partidos de los 5 días desde el primero.
  async function proximosPartidos(despuesDe) {
    const meses = [0, 1, 2, 3].map(n => mesESPN(new Date(despuesDe.getFullYear(), despuesDe.getMonth() + n, 1)));
    const futuros = (await Promise.all(meses.map(traerPartidos))).flat()
      .filter(p => p.fecha > despuesDe)
      .sort((a, b) => a.fecha - b.fecha);
    if (futuros.length === 0) return [];
    const limite = sumarDias(futuros[0].fecha, 5);
    return futuros.filter(p => p.fecha < limite);
  }

  // El cuadradito del medio: la hora si no empezó, el resultado si se está jugando o terminó
  function resultado(p) {
    const tipo = p.estado.name || "";
    const goles = p.local.goles + " - " + p.visitante.goles;
    if (p.estado.state === "pre") {
      return '<span class="liga-resultado">' + hora(p.fecha) + "</span>";
    }
    if (p.estado.state === "in") {
      const minuto = tipo === "STATUS_HALFTIME" ? "Entretiempo" : (p.reloj || "En juego");
      return '<span class="liga-resultado vivo">' + goles + "<small>" + escapar(minuto) + "</small></span>";
    }
    if (p.estado.completed) {
      return '<span class="liga-resultado">' + goles + "<small>Final</small></span>";
    }
    // Terminó sin jugarse
    const motivo = tipo.includes("POSTPONED") ? "Postergado" : tipo.includes("CANCELED") ? "Cancelado" : "Suspendido";
    return '<span class="liga-resultado">–<small>' + motivo + "</small></span>";
  }

  // ---------- PESTAÑA TABLA ANUAL ----------
  // Tabla anual = puntos del Apertura + puntos del Clausura.
  // ESPN no la da armada, así que la calculamos con los partidos terminados del año.
  async function cargarTabla() {
    if (!liga.tabla || Date.now() - liga.tabla.hora > UNA_HORA) {
      const partidos = await traerPartidos(new Date().getFullYear());
      liga.tabla = { hora: Date.now(), filas: calcularTabla(partidos) };
      guardarLiga();
    }

    const filas = liga.tabla.filas;
    if (filas.length === 0) return '<div class="liga-aviso">Todavía no hay partidos jugados este año.</div>';
    let html = '<table><tr><th>#</th><th class="equipo">Equipo</th><th>PJ</th><th>DG</th><th>Pts</th></tr>';
    filas.forEach((f, i) => {
      html += "<tr><td>" + (i + 1) + '</td><td class="equipo">' + logo(f.logo) + " " + escapar(f.nombre) + "</td>" +
        "<td>" + f.pj + "</td><td>" + (f.dg > 0 ? "+" + f.dg : f.dg) + "</td><td><strong>" + f.pts + "</strong></td></tr>";
    });
    return html + "</table>";
  }

  function calcularTabla(partidos) {
    const equipos = {};
    function sumar(equipo, favor, contra) {
      if (!equipos[equipo.id]) equipos[equipo.id] = { nombre: equipo.nombre, logo: equipo.logo, pj: 0, dg: 0, gf: 0, pts: 0 };
      const fila = equipos[equipo.id];
      fila.pj++;
      fila.gf += favor;
      fila.dg += favor - contra;
      fila.pts += favor > contra ? 3 : favor === contra ? 1 : 0;
    }
    for (const p of partidos) {
      if (!p.estado.completed || p.eliminatoria) continue;
      sumar(p.local, p.local.goles, p.visitante.goles);
      sumar(p.visitante, p.visitante.goles, p.local.goles);
    }
    // Desempate: puntos, después diferencia de gol, después goles a favor
    return Object.values(equipos).sort((a, b) => b.pts - a.pts || b.dg - a.dg || b.gf - a.gf);
  }

  // ---------- DIBUJAR EL WIDGET ----------
  function escapar(texto) {
    const div = document.createElement("div");
    div.textContent = texto;
    return div.innerHTML;
  }

  function logo(url) {
    return url ? '<img src="' + escapar(url) + '" alt="" loading="lazy" onerror="this.remove()">' : "";
  }

  async function dibujarLiga() {
    document.getElementById("liga").classList.toggle("abierta", liga.abierto);
    document.querySelectorAll(".liga-pestanas button").forEach(boton => {
      boton.classList.toggle("activa", boton.dataset.pestana === liga.pestana);
    });
    if (!liga.abierto) return;

    const contenido = document.getElementById("ligaContenido");
    const pie = document.getElementById("ligaPie");
    const pestana = liga.pestana;
    // "Cargando..." solo al cambiar de pestaña; al actualizar se deja lo anterior hasta que llegue lo nuevo
    if (contenido.dataset.pestana !== pestana) {
      contenido.innerHTML = '<div class="liga-aviso">Cargando...</div>';
      contenido.dataset.pestana = pestana;
    }
    let html;
    try {
      html = pestana === "partidos" ? await cargarPartidos() : await cargarTabla();
    } catch (error) {
      console.error(error);
      html = '<div class="liga-aviso">No se pudieron cargar los datos de ESPN. Probá de nuevo en un rato.</div>';
    }
    // Si mientras cargaba se cambió de pestaña o se minimizó, no pisamos lo nuevo
    if (pestana !== liga.pestana || !liga.abierto) return;
    const scroll = contenido.scrollTop;
    contenido.innerHTML = html;
    contenido.scrollTop = scroll;
    const actualizado = pestana === "tabla" && liga.tabla ? new Date(liga.tabla.hora) : new Date();
    pie.textContent = "Datos: ESPN · actualizado " + hora(actualizado);
  }

  document.getElementById("ligaAbrir").onclick = () => { liga.abierto = true; guardarLiga(); dibujarLiga(); };
  document.getElementById("ligaCerrar").onclick = () => { liga.abierto = false; guardarLiga(); dibujarLiga(); };
  document.getElementById("ligaRecargar").onclick = () => {
    if (liga.pestana === "tabla") liga.tabla = null; // fuerza a recalcular la tabla
    dibujarLiga();
  };
  document.querySelectorAll(".liga-pestanas button").forEach(boton => {
    boton.onclick = () => { liga.pestana = boton.dataset.pestana; guardarLiga(); dibujarLiga(); };
  });

  // Los resultados se actualizan solos cada 3 minutos mientras se ven los partidos
  setInterval(() => { if (liga.abierto && liga.pestana === "partidos") dibujarLiga(); }, 3 * 60 * 1000);

  dibujarLiga();
</script>

<script>
  // ---------- WIDGETS DE LA IZQUIERDA (dólar y clima) ----------
  // Usan escapar() y hora() del script de la liga.

  // Cuáles están abiertos. Si la pantalla no es ancha arrancan minimizados para no tapar las tareas.
  let izq = JSON.parse(localStorage.getItem("widgetsIzq")) || {};

  function guardarIzq() {
    localStorage.setItem("widgetsIzq", JSON.stringify(izq));
  }

  // Arma el abrir/minimizar de un widget. "cargar" trae los datos y se repite cada tantos minutos:
  // corre aunque esté minimizado, porque el botón minimizado también muestra el dato principal.
  function prepararMini(id, cargar, minutos) {
    const caja = document.getElementById(id);
    if (izq[id] === undefined) izq[id] = window.innerWidth >= 1200;
    function dibujar() { caja.classList.toggle("abierto", izq[id]); }
    caja.querySelector(".mini-abrir").onclick = () => { izq[id] = true; guardarIzq(); dibujar(); };
    caja.querySelector(".mini-cerrar").onclick = () => { izq[id] = false; guardarIzq(); dibujar(); };
    dibujar();
    cargar(caja);
    setInterval(() => cargar(caja), minutos * 60 * 1000);
  }

  // "hoy 17:55" o "28/10 17:55"
  function cuando(fecha) {
    const hoy = new Date().toDateString() === fecha.toDateString();
    return (hoy ? "hoy" : fecha.getDate() + "/" + (fecha.getMonth() + 1)) + " " + hora(fecha);
  }

  // ---------- DÓLAR ----------
  // Cotizaciones de DolarApi (dolarapi.com): gratis y sin clave. Toma los valores de DolarHoy.
  // Cada cotización viene así: { casa: "blue", nombre: "Blue", compra: 1545, venta: 1565, fechaActualizacion: "..." }
  const DOLAR_API = "https://dolarapi.com/v1/dolares";
  const NOMBRES_DOLAR = {
    oficial: "Oficial", blue: "Blue", bolsa: "MEP", contadoconliqui: "CCL",
    mayorista: "Mayorista", cripto: "Cripto", tarjeta: "Tarjeta"
  };

  function pesos(valor) {
    return typeof valor === "number" ? "$" + valor.toLocaleString("es-AR", { maximumFractionDigits: 0 }) : "–";
  }

  async function cargarDolar(caja) {
    const contenido = caja.querySelector(".mini-contenido");
    try {
      const respuesta = await fetch(DOLAR_API);
      if (!respuesta.ok) throw new Error("DolarApi respondió " + respuesta.status);
      const cotizaciones = await respuesta.json();

      let html = "<table><tr><th></th><th>Compra</th><th>Venta</th></tr>";
      for (const c of cotizaciones) {
        html += "<tr><td>" + escapar(NOMBRES_DOLAR[c.casa] || c.nombre) + "</td>" +
          "<td>" + pesos(c.compra) + "</td><td><strong>" + pesos(c.venta) + "</strong></td></tr>";
      }
      contenido.innerHTML = html + "</table>";

      const blue = cotizaciones.find(c => c.casa === "blue");
      if (blue) caja.querySelector(".mini-abrir").textContent = "💵 Blue " + pesos(blue.venta);
      const ultima = new Date(Math.max(...cotizaciones.map(c => new Date(c.fechaActualizacion))));
      caja.querySelector(".mini-pie").textContent = "Datos: DolarApi · " + cuando(ultima);
    } catch (error) {
      console.error(error);
      contenido.innerHTML = '<div class="mini-aviso">No se pudo cargar el dólar. Probá de nuevo en un rato.</div>';
    }
  }

  prepararMini("dolar", cargarDolar, 10);

  // ---------- CLIMA ----------
  // Pronóstico de Open-Meteo (open-meteo.com): gratis para uso no comercial y sin clave.
  // Pide que se lo nombre donde se muestran los datos, por eso el link de abajo.
  // Las coordenadas son las del centro de CABA.
  const CLIMA_API = "https://api.open-meteo.com/v1/forecast?latitude=-34.61&longitude=-58.38" +
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&timezone=America%2FArgentina%2FBuenos_Aires&forecast_days=3";

  // Códigos de tiempo de la OMM que usa Open-Meteo en weather_code
  const TIEMPO = {
    0: ["☀️", "Despejado"], 1: ["🌤️", "Mayormente despejado"], 2: ["⛅", "Parcialmente nublado"], 3: ["☁️", "Nublado"],
    45: ["🌫️", "Niebla"], 48: ["🌫️", "Niebla con escarcha"],
    51: ["🌦️", "Llovizna leve"], 53: ["🌦️", "Llovizna"], 55: ["🌧️", "Llovizna intensa"],
    56: ["🌧️", "Llovizna helada"], 57: ["🌧️", "Llovizna helada"],
    61: ["🌦️", "Lluvia leve"], 63: ["🌧️", "Lluvia"], 65: ["🌧️", "Lluvia fuerte"],
    66: ["🌧️", "Lluvia helada"], 67: ["🌧️", "Lluvia helada"],
    71: ["🌨️", "Nevada leve"], 73: ["🌨️", "Nevada"], 75: ["❄️", "Nevada fuerte"], 77: ["🌨️", "Nieve granulada"],
    80: ["🌦️", "Chaparrones leves"], 81: ["🌧️", "Chaparrones"], 82: ["⛈️", "Chaparrones fuertes"],
    85: ["🌨️", "Chaparrones de nieve"], 86: ["🌨️", "Chaparrones de nieve"],
    95: ["⛈️", "Tormenta"], 96: ["⛈️", "Tormenta con granizo"], 99: ["⛈️", "Tormenta con granizo"]
  };

  function tiempo(codigo, esDeDia) {
    const [icono, texto] = TIEMPO[codigo] || ["🌡️", ""];
    // De noche, el sol de "despejado" pasa a ser luna
    return [!esDeDia && codigo <= 1 ? "🌙" : icono, texto];
  }

  function grados(valor) {
    return Math.round(valor) + "°";
  }

  async function cargarClima(caja) {
    const contenido = caja.querySelector(".mini-contenido");
    try {
      const respuesta = await fetch(CLIMA_API);
      if (!respuesta.ok) throw new Error("Open-Meteo respondió " + respuesta.status);
      const { current: ahora, daily: dias } = await respuesta.json();

      const [icono, texto] = tiempo(ahora.weather_code, ahora.is_day === 1);
      let html = '<div class="clima-ahora"><span class="clima-temp">' + icono + " " + grados(ahora.temperature_2m) + "</span>" +
        "<span>" + texto + "</span></div>" +
        '<div class="clima-detalle">Sensación ' + grados(ahora.apparent_temperature) +
        " · Humedad " + ahora.relative_humidity_2m + "%" +
        " · Viento " + Math.round(ahora.wind_speed_10m) + " km/h</div>";

      // Hoy, mañana y pasado: mínima / máxima y probabilidad de lluvia
      html += "<table>";
      dias.time.forEach((dia, i) => {
        const nombre = i === 0 ? "Hoy" : i === 1 ? "Mañana" :
          new Date(dia + "T12:00").toLocaleDateString("es-AR", { weekday: "long" }).replace(/^./, l => l.toUpperCase());
        const [iconoDia, textoDia] = tiempo(dias.weather_code[i], true);
        html += "<tr><td>" + nombre + '</td><td title="' + textoDia + '">' + iconoDia + "</td>" +
          "<td>" + grados(dias.temperature_2m_min[i]) + " / <strong>" + grados(dias.temperature_2m_max[i]) + "</strong></td>" +
          '<td title="Probabilidad de lluvia">💧' + dias.precipitation_probability_max[i] + "%</td></tr>";
      });
      contenido.innerHTML = html + "</table>";

      caja.querySelector(".mini-abrir").textContent = icono + " " + grados(ahora.temperature_2m);
      caja.querySelector(".mini-pie").innerHTML = 'Datos: <a href="https://open-meteo.com/" target="_blank">Open-Meteo.com</a> · ' +
        cuando(new Date(ahora.time));
    } catch (error) {
      console.error(error);
      contenido.innerHTML = '<div class="mini-aviso">No se pudo cargar el clima. Probá de nuevo en un rato.</div>';
    }
  }

  // Open-Meteo actualiza el dato actual cada 15 minutos
  prepararMini("clima", cargarClima, 15);
</script>
